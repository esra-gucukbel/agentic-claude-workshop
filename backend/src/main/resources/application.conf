ktor {
    deployment {
        port = 8080
        port = ${?PORT}
    }
    application {
        modules = [ com.vibeplanner.ApplicationKt.module ]
    }
}

jwt {
    secret = ${JWT_SECRET}
    issuer = "vibe-planner"
    audience = "vibe-planner-users"
    realm = "vibe-planner"
}

database {
    host = ${POSTGRES_HOST}
    port = "5432"
    name = ${POSTGRES_DB}
    user = ${POSTGRES_USER}
    password = ${POSTGRES_PASSWORD}
}
