services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: vibeplanner
      POSTGRES_USER: vibeplanner
      POSTGRES_PASSWORD: vibeplanner
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vibeplanner -d vibeplanner"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    build: ./backend
    ports:
      - "8080:8080"
    environment:
      POSTGRES_HOST: database
      POSTGRES_DB: vibeplanner
      POSTGRES_USER: vibeplanner
      POSTGRES_PASSWORD: vibeplanner
      JWT_SECRET: "workshop-super-secret-key-change-in-prod"
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
